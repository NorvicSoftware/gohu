<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laravel Gohu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e1e1e;
            font-family: 'Segoe UI', sans-serif;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        .panel-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #007acc;
            min-width: 0;
        }

        .panel-header {
            background: #252526;
            color: #cccccc;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 6px 10px;
            border-bottom: 1px solid #3c3c3c;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        .panel-header .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #007acc;
        }

        .btn-house {
            background: transparent;
            border: 1px solid #3c3c3c;
            color: #ccc;
            padding: 3px 7px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            transition: border-color 0.2s, background 0.2s;
        }

        .btn-house:hover {
            border-color: #007acc;
            background: #2a2d2e;
        }

        .btn-run {
            background: #28a745;
            border: none;
            color: #fff;
            padding: 3px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            transition: background 0.2s;
        }

        .btn-run:hover {
            background: #22923c;
        }

        .btn-scan {
            background: #dc3545;
            border: none;
            color: #fff;
            padding: 3px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.03em;
            transition: background 0.2s;
        }

        .btn-scan:hover { background: #c22030; }
        .btn-scan:disabled { opacity: 0.55; cursor: default; }

        /* ── N+1 scan overlay ── */
        .scan-overlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
        }

        .scan-overlay[hidden] { display: none; }

        .scan-overlay-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-bottom: 1px solid #3c3c3c;
            background: #252526;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #cdd9f5;
        }

        .scan-overlay-header .tag {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #dc3545;
        }

        .scan-close {
            margin-left: auto;
            background: transparent;
            border: none;
            color: #9fb0d4;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 2px 7px;
            border-radius: 4px;
        }

        .scan-close:hover { background: rgba(255, 255, 255, 0.09); color: #fff; }

        .scan-summary {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 10px 14px;
            border-bottom: 1px solid #3c3c3c;
            background: #252526;
            font-size: 12px;
            color: #cccccc;
            flex-shrink: 0;
        }

        .scan-summary .big { font-size: 16px; font-weight: 700; }
        .scan-summary .big.warn { color: #f1707b; }
        .scan-summary .big.ok { color: #4ec46a; }
        .scan-summary .muted { color: #8a8a8a; }

        .scan-list { flex: 1; overflow: auto; padding: 6px; }

        .finding {
            padding: 9px 11px;
            margin: 5px;
            border: 1px solid #3c3c3c;
            border-radius: 6px;
            background: #232323;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }

        .finding:hover { border-color: #7c5cff; background: #2a2733; }

        .finding .top { display: flex; align-items: center; gap: 8px; }

        .finding .loc { font-family: 'Consolas', 'Menlo', monospace; font-size: 12px; color: #9cdcfe; }

        .finding .badge {
            font-size: 9.5px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 8px;
            letter-spacing: 0.04em;
        }

        .finding .badge.high { background: #dc354533; color: #f1707b; }
        .finding .badge.medium { background: #e0a80033; color: #f0c674; }

        .finding .rel { margin-top: 5px; font-size: 12px; color: #dddddd; }
        .finding .rel code { color: #ce9178; }
        .finding .fix { margin-top: 3px; font-size: 11.5px; color: #6a9955; font-family: 'Consolas', 'Menlo', monospace; }

        .scan-empty { padding: 26px; text-align: center; color: #4ec46a; font-size: 13px; }
        .scan-empty.err { color: #f1707b; }

        .path-display {
            margin-left: auto;
            color: #6a9955;
            font-size: 11px;
            font-style: italic;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            opacity: 0.85;
        }

        #monaco-editor {
            flex: 1;
            width: 100%;
        }

        /* ── Draggable divider ── */
        .divider {
            width: 4px;
            background: #3c3c3c;
            cursor: col-resize;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .divider:hover,
        .divider.dragging {
            background: #007acc;
        }

        /* ── Right panel ── */
        .panel-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .panel-right-header {
            position: relative;
            background: #252526;
            color: #cccccc;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 6px 10px;
            border-bottom: 1px solid #3c3c3c;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        .status-circle {
            width: 12px;
            height: 12px;
            padding: 0;
            border: none;
            border-radius: 50%;
            margin-left: auto;
            flex-shrink: 0;
            cursor: pointer;
            background: #555;
            transition: background 0.4s, box-shadow 0.4s;
        }

        .status-circle:hover {
            box-shadow: 0 0 0 3px #ffffff1a;
        }

        .status-circle.online {
            background: #28a745;
            box-shadow: 0 0 6px #28a74580;
        }

        .status-circle.offline {
            background: #dc3545;
            box-shadow: 0 0 6px #dc354580;
        }

        .status-circle.checking {
            background: #e0a800;
            box-shadow: 0 0 6px #e0a80080;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        /* ── Server status popover ── */
        .status-popover {
            position: absolute;
            top: calc(100% + 6px);
            right: 8px;
            z-index: 50;
            width: 300px;
            background: #252526;
            border: 1px solid #3c3c3c;
            border-radius: 6px;
            box-shadow: 0 6px 20px #00000066;
            color: #cccccc;
            text-transform: none;
            letter-spacing: normal;
            font-weight: 400;
            overflow: hidden;
        }

        .status-popover[hidden] {
            display: none;
        }

        .status-popover-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-bottom: 1px solid #3c3c3c;
            font-size: 12px;
            font-weight: 600;
        }

        .status-popover-header .title-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
            background: #555;
        }

        .status-popover-header .title-dot.online { background: #28a745; }
        .status-popover-header .title-dot.offline { background: #dc3545; }
        .status-popover-header .title-dot.checking { background: #e0a800; }

        .status-recheck {
            background: transparent;
            border: 1px solid #3c3c3c;
            color: #ccc;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            transition: border-color 0.2s, background 0.2s;
        }

        .status-recheck:hover {
            border-color: #007acc;
            background: #2a2d2e;
        }

        .status-popover-body {
            padding: 8px 10px;
            font-size: 12px;
            line-height: 1.5;
        }

        .status-row {
            display: flex;
            gap: 8px;
            padding: 2px 0;
        }

        .status-row .label {
            color: #8a8a8a;
            min-width: 84px;
            flex-shrink: 0;
        }

        .status-row .value {
            color: #dddddd;
            word-break: break-all;
        }

        .status-error {
            margin-top: 6px;
            padding: 8px;
            background: #dc35451a;
            border: 1px solid #dc354540;
            border-radius: 4px;
            color: #f1a5ad;
            font-family: 'Consolas', 'Menlo', monospace;
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 160px;
            overflow: auto;
        }

        .panel-right-content {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e1e1e;
            min-height: 0;
        }

        .empty-state {
            text-align: center;
            color: #3c3c3c;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 13px;
            letter-spacing: 0.05em;
        }

        /* ── Header loading indicator (next to "Result") ── */
        .header-loading {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: normal;
            text-transform: none;
            color: #8a8a8a;
        }

        .header-loading[hidden] {
            display: none;
        }

        /* ── N+1 chip (reopen last scan) ── */
        .n1-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-left: 4px;
            padding: 2px 5px 2px 9px;
            border-radius: 11px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: none;
            cursor: pointer;
            border: 1px solid transparent;
            transition: filter 0.15s;
        }

        .n1-chip[hidden] { display: none; }
        .n1-chip:hover { filter: brightness(1.15); }
        .n1-chip.warn { background: rgba(220, 53, 69, 0.16); color: #f1707b; border-color: rgba(220, 53, 69, 0.4); }
        .n1-chip.ok { background: rgba(40, 167, 69, 0.16); color: #4ec46a; border-color: rgba(40, 167, 69, 0.4); }
        .n1-chip .n1-chip-label { cursor: pointer; }

        .n1-chip .n1-chip-x {
            display: inline-grid;
            place-items: center;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            font-size: 10px;
            opacity: 0.7;
        }

        .n1-chip .n1-chip-x:hover { background: rgba(255, 255, 255, 0.16); opacity: 1; }

        .spinner-sm {
            width: 11px;
            height: 11px;
            border: 2px solid #3c3c3c;
            border-top-color: #007acc;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Result view ── */
        .result-view {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-self: stretch;
        }

        .result-json {
            flex: 1;
            margin: 0;
            padding: 12px;
            overflow: auto;
            font-family: 'Consolas', 'Menlo', monospace;
            font-size: 12px;
            line-height: 1.5;
            color: #d4d4d4;
            white-space: pre;
            tab-size: 2;
        }

        .result-json.error {
            color: #f1a5ad;
        }
    </style>
</head>

<body>

    <div class="container" id="container">

        <!-- Left Panel -->
        <div class="panel-left" id="panelLeft">
            <div class="panel-header">
                <!-- House button + Run button -->
                <button class="btn-house" id="btnHouse" title="Select folder">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z" />
                        <path d="M9 21V12h6v9" />
                    </svg>
                </button>
                <button class="btn-run" id="btnRun">▶ Run</button>
                <button class="btn-scan" id="btnScan" title="Scan the whole project for N+1 query patterns">Detection N+1</button>

                <!-- Selected path (empty if none) -->
                <span class="path-display" id="pathDisplay"></span>
            </div>
            <div id="monaco-editor"></div>
        </div>

        <!-- Draggable divider -->
        <div class="divider" id="divider"></div>

        <!-- Right Panel -->
        <div class="panel-right" id="panelRight">
            <div class="panel-right-header">
                <span class="dot" style="background:#444"></span>
                Result
                <span class="header-loading" id="headerLoading" hidden>
                    <span class="spinner-sm"></span>Running…
                </span>
                <!-- N+1 chip: reopens the last scan findings without re-scanning -->
                <span class="n1-chip" id="n1Chip" hidden>
                    <span class="n1-chip-label" id="n1ChipLabel">N+1: 0</span>
                    <span class="n1-chip-x" id="n1ChipX" title="Dismiss">✕</span>
                </span>
                <!-- Server status button -->
                <button class="status-circle" id="statusCircle" title="Server status — click for details"
                    aria-label="Server status" aria-haspopup="true" aria-expanded="false"></button>

                <!-- Server status details popover -->
                <div class="status-popover" id="statusPopover" hidden>
                    <div class="status-popover-header">
                        <span><span class="title-dot" id="popoverDot"></span><span id="popoverTitle">Checking…</span></span>
                        <button class="status-recheck" id="statusRecheck">Re-check</button>
                    </div>
                    <div class="status-popover-body" id="statusPopoverBody"></div>
                </div>
            </div>
            <div class="panel-right-content" id="resultContent">
                <div class="empty-state" id="emptyState">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <line x1="12" y1="8" x2="12" y2="16" />
                        <line x1="8" y1="12" x2="16" y2="12" />
                    </svg>
                </div>
                <div class="result-view" id="resultView" hidden>
                    <pre class="result-json" id="resultJson"></pre>
                </div>
                <div class="scan-overlay" id="scanOverlay" hidden>
                    <div class="scan-overlay-header">
                        <span class="tag"></span> N+1 Detection
                        <button class="scan-close" id="scanClose" title="Close">✕</button>
                    </div>
                    <div class="scan-summary" id="scanSummary"></div>
                    <div class="scan-list" id="scanList"></div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script>
        const vscode = acquireVsCodeApi();

        // ── Server status ──
        const statusCircle = document.getElementById('statusCircle');
        const statusPopover = document.getElementById('statusPopover');
        const popoverDot = document.getElementById('popoverDot');
        const popoverTitle = document.getElementById('popoverTitle');
        const statusPopoverBody = document.getElementById('statusPopoverBody');

        let currentStatus = 'checking'; // 'online' | 'offline' | 'checking'
        let currentDetails = null;

        const STATUS_LABEL = {
            online: 'Server online',
            offline: 'Server offline',
            checking: 'Checking…'
        };

        function applyServerStatus(status) {
            currentStatus = status;
            statusCircle.className = 'status-circle ' + status;
            popoverDot.className = 'title-dot ' + status;
            popoverTitle.textContent = STATUS_LABEL[status] || status;
            renderDetails();
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function row(label, value) {
            return '<div class="status-row"><span class="label">' + label +
                '</span><span class="value">' + escapeHtml(value) + '</span></div>';
        }

        function renderDetails() {
            if (currentStatus === 'checking') {
                statusPopoverBody.innerHTML = '<div class="status-row"><span class="value">Checking connection…</span></div>';
                return;
            }
            const d = currentDetails || {};
            let html = '';
            html += row('Project', d.projectPath || '— none selected —');
            html += row('Laravel', d.laravelDetected ? 'detected ✓' : 'not detected ✗');
            html += row('PHP', d.phpVersion ? (d.phpVersion + '  (' + (d.phpBinary || 'php') + ')') : (d.phpBinary || 'php'));
            if (currentStatus === 'online') {
                html += row('Connection', d.connection || '—');
                html += row('Driver', d.driver || '—');
                html += row('Database', d.database || '—');
            }
            if (d.error) {
                html += '<div class="status-error">' + escapeHtml(d.error) + '</div>';
            }
            statusPopoverBody.innerHTML = html;
        }

        function togglePopover(force) {
            const show = typeof force === 'boolean' ? force : statusPopover.hidden;
            statusPopover.hidden = !show;
            statusCircle.setAttribute('aria-expanded', String(show));
        }

        applyServerStatus('checking');

        // ── Result panel state ──
        const emptyState = document.getElementById('emptyState');
        const resultView = document.getElementById('resultView');
        const resultJson = document.getElementById('resultJson');
        const headerLoading = document.getElementById('headerLoading');
        const scanOverlay = document.getElementById('scanOverlay');
        const scanSummary = document.getElementById('scanSummary');
        const scanList = document.getElementById('scanList');
        const btnScan = document.getElementById('btnScan');
        const scanClose = document.getElementById('scanClose');
        const n1Chip = document.getElementById('n1Chip');
        const n1ChipLabel = document.getElementById('n1ChipLabel');
        const n1ChipX = document.getElementById('n1ChipX');

        function showResultState(state) { // 'empty' | 'result'
            emptyState.hidden = state !== 'empty';
            resultView.hidden = state !== 'result';
        }

        // The scan is an overlay: it covers the result without destroying it,
        // and can be closed to reveal whatever query result was underneath.
        function openScan() { scanOverlay.hidden = false; }
        function closeScan() { scanOverlay.hidden = true; }

        function renderQueryResult(result) {
            const ok = !!(result && result.success);
            resultJson.classList.toggle('error', !ok);
            resultJson.textContent = JSON.stringify(result, null, 2);
            showResultState('result');
        }

        // ── N+1 project scan ──
        function renderScan(result) {
            if (!result || !result.success) {
                n1Chip.hidden = true;
                scanSummary.innerHTML = '<span class="big warn">Error</span>';
                scanList.innerHTML = '<div class="scan-empty err">' + escapeHtml(result && result.error ? result.error : 'Scan failed') + '</div>';
                openScan();
                return;
            }
            const n = result.total_detected || 0;
            // Persistent chip in the header → reopen these findings anytime without re-scanning.
            n1ChipLabel.textContent = 'N+1: ' + n;
            n1Chip.className = 'n1-chip ' + (n ? 'warn' : 'ok');
            n1Chip.hidden = false;
            scanSummary.innerHTML =
                '<span class="big ' + (n ? 'warn' : 'ok') + '">' + n + '</span>' +
                '<span>N+1 ' + (n === 1 ? 'issue' : 'issues') + ' detected</span>' +
                '<span class="muted">· scanned ' + (result.scanned_files || 0) + ' files</span>';
            if (!n) {
                scanList.innerHTML = '<div class="scan-empty">✓ No N+1 patterns found. Nice and clean!</div>';
            } else {
                scanList.innerHTML = (result.findings || []).map(function (f) {
                    const conf = f.confidence === 'high' ? 'high' : 'medium';
                    return '<div class="finding" data-file="' + escapeHtml(f.file) + '" data-line="' + (f.line || 1) + '">' +
                        '<div class="top"><span class="badge ' + conf + '">' + conf.toUpperCase() + '</span>' +
                        '<span class="loc">' + escapeHtml(f.file) + ':' + (f.line || '') + '</span></div>' +
                        '<div class="rel"><code>' + escapeHtml(f.model) + '</code> · relation <code>' + escapeHtml(f.relation) + '</code> loaded inside a loop</div>' +
                        '<div class="fix">💡 ' + escapeHtml(f.suggestion) + '</div>' +
                        '</div>';
                }).join('');
            }
            openScan();
        }

        // Click a finding → open the file at that line
        scanList.addEventListener('click', function (e) {
            const el = e.target.closest ? e.target.closest('.finding') : null;
            if (!el) { return; }
            vscode.postMessage({ command: 'openFile', file: el.getAttribute('data-file'), line: parseInt(el.getAttribute('data-line'), 10) || 1 });
        });

        btnScan.addEventListener('click', function () {
            vscode.postMessage({ command: 'scanNPlusOne' });
        });

        scanClose.addEventListener('click', closeScan);

        // Chip: label reopens the last findings; ✕ dismisses the chip entirely.
        n1ChipLabel.addEventListener('click', openScan);
        n1ChipX.addEventListener('click', function (e) {
            e.stopPropagation();
            n1Chip.hidden = true;
            closeScan();
        });

        // Listen for status/result updates from the extension host
        window.addEventListener('message', event => {
            const msg = event.data;
            if (msg.command === 'setServerStatus') {
                if (msg.details !== undefined) {
                    currentDetails = msg.details;
                }
                applyServerStatus(msg.status);
            }
            if (msg.command === 'setPath') {
                document.getElementById('pathDisplay').textContent = msg.path;
            }
            if (msg.command === 'queryRunning') {
                headerLoading.hidden = false;
                closeScan(); // running a query brings focus back to the result
            }
            if (msg.command === 'queryResult') {
                headerLoading.hidden = true;
                renderQueryResult(msg.result);
            }
            if (msg.command === 'scanRunning') {
                btnScan.disabled = true;
                scanSummary.innerHTML = '<span class="spinner-sm"></span> Scanning project for N+1…';
                scanList.innerHTML = '';
                openScan();
            }
            if (msg.command === 'scanResult') {
                btnScan.disabled = false;
                renderScan(msg.result);
            }
        });

        // ── Status button: toggle details popover ──
        statusCircle.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePopover();
        });

        // Re-check button inside the popover
        document.getElementById('statusRecheck').addEventListener('click', (e) => {
            e.stopPropagation();
            vscode.postMessage({ command: 'checkStatus' });
        });

        // Close the popover when clicking outside of it
        document.addEventListener('click', (e) => {
            if (!statusPopover.hidden && !statusPopover.contains(e.target) && e.target !== statusCircle) {
                togglePopover(false);
            }
        });

        // Ask the host to run the initial connection check
        vscode.postMessage({ command: 'ready' });

        // ── House button: open folder picker via extension host ──
        document.getElementById('btnHouse').addEventListener('click', () => {
            vscode.postMessage({ command: 'openFolder' });
        });

        // ── Run button ──
        let editor = null;
        document.getElementById('btnRun').addEventListener('click', () => {
            vscode.postMessage({ command: 'run', text: editor ? editor.getValue() : '' });
        });

        // ── Monaco Editor ──
        require.config({
            paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }
        });
        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('monaco-editor'), {
                value: `<?php

// write code
`,
                language: 'php',
                theme: 'vs-dark',
                fontSize: 14,
                minimap: { enabled: true },
                automaticLayout: true,
                scrollBeyondLastLine: false,
                lineNumbers: 'on',
                glyphMargin: false,
                folding: true,
                lineDecorationsWidth: 10,
                lineNumbersMinChars: 3,
            });

            editor.onDidChangeModelContent(() => {
                vscode.postMessage({ command: 'editorContent', text: editor.getValue() });
            });
        });

        const divider = document.getElementById('divider');
        const container = document.getElementById('container');
        const panelLeft = document.getElementById('panelLeft');
        const panelRight = document.getElementById('panelRight');
        let isDragging = false;

        divider.addEventListener('mousedown', () => {
            isDragging = true;
            divider.classList.add('dragging');
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
        });
        document.addEventListener('mousemove', e => {
            if (!isDragging) return;
            const rect = container.getBoundingClientRect();
            const offset = Math.max(200, Math.min(e.clientX - rect.left, rect.width - 200));
            const pct = (offset / rect.width) * 100;
            panelLeft.style.flex = 'none';
            panelLeft.style.width = pct + '%';
            panelRight.style.flex = 'none';
            panelRight.style.width = (100 - pct) + '%';
        });
        document.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;
            divider.classList.remove('dragging');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
        });
    </script>

</body>

</html>
